<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AnaFins - Entrar</title>
    <link rel="manifest" href="{{ url_for('acesso.manifest') }}">
    <meta name="theme-color" content="#0f0f13">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-192.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='tailwind.css') }}">
    <style>
        body { background-color: #0f0f13; color: #f3f4f6; font-family: 'Inter', sans-serif; }
        input { background-color: #141419 !important; border: 1px solid #23232d !important; color: white !important; font-size: 16px; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-xs flex flex-col items-center gap-6">
        <img src="{{ url_for('static', filename='logo-96.png') }}" alt="" class="h-20 w-20">
        <h1 class="text-2xl font-bold tracking-widest">AnaFins</h1>

        {% if not tem_pin %}
        <p class="text-center text-sm text-gray-400">
            O acesso pelo celular ainda não foi liberado.<br>
            No computador, abra o AnaFins e vá em <b class="text-white">📱 Usar no celular</b> para criar um PIN.
        </p>
        {% else %}
        <form method="POST" class="w-full flex flex-col gap-4">
            <input type="password" name="pin" inputmode="numeric" pattern="[0-9]*" autocomplete="current-password"
                   required autofocus placeholder="PIN" class="w-full px-4 py-4 rounded-xl text-center text-2xl tracking-[.5em]">
            {% if erro %}<p class="text-rose-400 text-sm text-center">{{ erro }}</p>{% endif %}
            <button type="submit" class="py-4 rounded-xl bg-gradient-to-r from-pink-500 to-red-600 text-white font-bold">Entrar</button>
        </form>
        {% endif %}
    </div>
</body>
</html>
