name: testes

on:
  push:
  pull_request:

jobs:
  python:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install Flask==3.1.3 fpdf2==2.9.0 tzdata==2026.6 pytest==9.2.0 ruff==0.17.3
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest
